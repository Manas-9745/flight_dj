<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E232A" />
      <stop offset="100%" stop-color="#0F1318" />
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Subtle glow ring -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Radar pulse ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="2" stroke-dasharray="6 8" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2" />

  <!-- AeroMate Jet Icon (Centred, bold, aerodynamic) -->
  <g transform="translate(256, 256) scale(8.5) translate(-24, -24)" filter="url(#shadow)">
    <!-- Jet silhouette -->
    <path
      d="M24 4 C23 4 22 5 22 6.5 L22 17 L7 25 L7 28.5 L22 24 L22 36 L17 40 L17 43 L24 41 L31 43 L31 40 L26 36 L26 24 L41 28.5 L41 25 L26 17 L26 6.5 C26 5 25 4 24 4 Z"
      fill="url(#planeGrad)"
    />
    <!-- Cockpit / Navigation Light Accent -->
    <circle cx="24" cy="9" r="1.5" fill="url(#accentGrad)" />
    <!-- Wingtip Lights -->
    <circle cx="7" cy="28.5" r="1" fill="#EF4444" />
    <circle cx="41" cy="28.5" r="1" fill="#10B981" />
  </g>
</svg>
